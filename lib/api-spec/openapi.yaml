openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PST Factory product manufacturing platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
  - name: projects
  - name: libraries
  - name: manufacturing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /pst/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get factory dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /pst/dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent factory activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FactoryEvent"
  /pst/projects:
    get:
      operationId: listPstProjects
      tags: [projects]
      summary: List PST projects
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProjectStatus"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: PST project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PstProject"
    post:
      operationId: createPstProject
      tags: [projects]
      summary: Create a PST project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PstProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProject"
  /pst/projects/{projectId}:
    get:
      operationId: getPstProject
      tags: [projects]
      summary: Get a PST project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: PST project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProject"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePstProject
      tags: [projects]
      summary: Update a PST project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PstProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProject"
  /pst/projects/{projectId}/duplicate:
    post:
      operationId: duplicatePstProject
      tags: [projects]
      summary: Duplicate a PST project for reuse
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "201":
          description: Duplicated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProject"
  /pst/projects/{projectId}/archive:
    post:
      operationId: archivePstProject
      tags: [projects]
      summary: Archive a PST project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Archived project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProject"
  /pst/projects/{projectId}/architect:
    post:
      operationId: runPstArchitect
      tags: [manufacturing]
      summary: Generate a proposed PST blueprint
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchitectInput"
      responses:
        "200":
          description: Architect proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstBlueprint"
  /pst/projects/{projectId}/blueprint:
    get:
      operationId: getPstBlueprint
      tags: [manufacturing]
      summary: Get the current PST blueprint
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: PST blueprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstBlueprint"
    patch:
      operationId: updatePstBlueprint
      tags: [manufacturing]
      summary: Edit the PST blueprint
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueprintUpdate"
      responses:
        "200":
          description: Updated PST blueprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstBlueprint"
  /pst/assets:
    get:
      operationId: listPstAssets
      tags: [libraries]
      summary: List reusable PST assets
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/AssetType"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PstAsset"
  /pst/patterns:
    get:
      operationId: listPstPatterns
      tags: [libraries]
      summary: List reusable problem-solving patterns
      responses:
        "200":
          description: Pattern list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PstPattern"
  /pst/recipes:
    get:
      operationId: listPstRecipes
      tags: [libraries]
      summary: List reusable PST recipes
      responses:
        "200":
          description: Recipe list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PstRecipe"
  /pst/projects/{projectId}/builder:
    post:
      operationId: buildPstProject
      tags: [manufacturing]
      summary: Assemble a PST from its blueprint
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildInput"
      responses:
        "200":
          description: Build result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildResult"
  /pst/projects/{projectId}/simulate:
    post:
      operationId: simulatePstProject
      tags: [manufacturing]
      summary: Run a PST simulation
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationInput"
      responses:
        "200":
          description: Simulation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationReport"
  /pst/projects/{projectId}/qa:
    post:
      operationId: runPstQa
      tags: [manufacturing]
      summary: Run PST quality assurance
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: QA run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QaRun"
  /pst/projects/{projectId}/approve:
    post:
      operationId: approvePstProject
      tags: [manufacturing]
      summary: Approve a PST for publishing
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Approved project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProject"
  /pst/projects/{projectId}/publish:
    post:
      operationId: publishPstProject
      tags: [manufacturing]
      summary: Publish an approved PST
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Published project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProject"
  /pst/projects/{projectId}/workspace:
    get:
      operationId: getPstWorkspace
      tags: [projects]
      summary: Get the customer-facing PST workspace
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Published workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstWorkspace"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProjectStatus:
      type: string
      enum: [DRAFT, ARCHITECTED, BLUEPRINT_READY, BUILDING, PREVIEW, QA, APPROVED, PUBLISHED, ARCHIVED]
    PstProject:
      type: object
      required: [id, name, slug, description, status, version, domain, family, series, problemStatement, targetUser, desiredOutcome, productDna, blueprint, components, qaStatus, publicationStatus, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        version: { type: string }
        domain: { type: string }
        family: { type: string }
        series: { type: string }
        problemStatement: { type: string }
        targetUser: { type: string }
        desiredOutcome: { type: string }
        productDna: { $ref: "#/components/schemas/ProductDna" }
        blueprint: { $ref: "#/components/schemas/PstBlueprint" }
        components:
          type: array
          items: { $ref: "#/components/schemas/ComponentSelection" }
        qaStatus: { $ref: "#/components/schemas/QaStatus" }
        publicationStatus: { type: string, enum: [UNPUBLISHED, PUBLISHED, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PstProjectInput:
      type: object
      required: [name, problemStatement, targetUser, desiredOutcome]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        domain: { type: string }
        family: { type: string }
        series: { type: string }
        problemStatement: { type: string, minLength: 1 }
        targetUser: { type: string, minLength: 1 }
        desiredOutcome: { type: string, minLength: 1 }
    PstProjectUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        domain: { type: string }
        family: { type: string }
        series: { type: string }
        problemStatement: { type: string }
        targetUser: { type: string }
        desiredOutcome: { type: string }
    ProductDna:
      type: object
      required: [problem, user, journey, components, intelligence, outcome]
      properties:
        problem: { type: string }
        user: { type: string }
        journey: { type: array, items: { type: string } }
        components: { type: array, items: { type: string } }
        intelligence: { type: string }
        outcome: { type: string }
    PstBlueprint:
      type: object
      required: [id, projectId, problem, targetUser, desiredOutcome, problemType, journey, knowledgeRequirements, componentRequirements, aiRequirements, workflow, expectedOutput, actionPlan, nextStep, version, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        problem: { type: string }
        targetUser: { type: string }
        desiredOutcome: { type: string }
        problemType: { type: string }
        journey: { type: array, items: { type: string } }
        knowledgeRequirements: { type: array, items: { type: string } }
        componentRequirements: { type: array, items: { type: string } }
        aiRequirements: { type: array, items: { type: string } }
        workflow: { type: array, items: { $ref: "#/components/schemas/WorkflowStep" } }
        expectedOutput: { type: array, items: { type: string } }
        actionPlan: { type: array, items: { type: string } }
        nextStep: { type: string }
        version: { type: string }
        updatedAt: { type: string, format: date-time }
    BlueprintUpdate:
      type: object
      properties:
        problem: { type: string }
        targetUser: { type: string }
        desiredOutcome: { type: string }
        problemType: { type: string }
        journey: { type: array, items: { type: string } }
        knowledgeRequirements: { type: array, items: { type: string } }
        componentRequirements: { type: array, items: { type: string } }
        aiRequirements: { type: array, items: { type: string } }
        expectedOutput: { type: array, items: { type: string } }
        actionPlan: { type: array, items: { type: string } }
        nextStep: { type: string }
    ArchitectInput:
      type: object
      properties:
        additionalContext: { type: string }
    WorkflowStep:
      type: object
      required: [id, type, title, description, inputs, outputs, dependencies, nextStep]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        description: { type: string }
        inputs: { type: array, items: { type: string } }
        outputs: { type: array, items: { type: string } }
        dependencies: { type: array, items: { type: string } }
        nextStep: { type: string }
        configuration: { type: object, additionalProperties: true }
    AssetType:
      type: string
      enum: [KNOWLEDGE, TOOL, MINI_APP, AI, WORKFLOW]
    PstAsset:
      type: object
      required: [id, name, type, description, version, status, tags, domain, compatibility, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        type: { $ref: "#/components/schemas/AssetType" }
        description: { type: string }
        version: { type: string }
        status: { type: string, enum: [ACTIVE, DRAFT, ARCHIVED] }
        tags: { type: array, items: { type: string } }
        domain: { type: string }
        compatibility: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PstPattern:
      type: object
      required: [id, name, description, steps, usageCount]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        steps: { type: array, items: { type: string } }
        usageCount: { type: number }
    PstRecipe:
      type: object
      required: [id, name, description, components, usageCount]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        components: { type: array, items: { type: string } }
        usageCount: { type: number }
    ComponentSelection:
      type: object
      required: [id, name, type, source, status]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        source: { type: string }
        status: { type: string, enum: [READY, MISSING, WARNING] }
    BuildInput:
      type: object
      properties:
        assetIds: { type: array, items: { type: string } }
        recipeId: { type: string }
    BuildResult:
      type: object
      required: [status, ready, missing, warnings, errors, components]
      properties:
        status: { type: string, enum: [READY, BLOCKED] }
        ready: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        errors: { type: array, items: { type: string } }
        components: { type: array, items: { $ref: "#/components/schemas/ComponentSelection" } }
    SimulationInput:
      type: object
      properties:
        mode: { type: string, enum: [MANUAL, SYNTHETIC] }
    SimulationReport:
      type: object
      required: [id, status, checks, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [PASS, WARNING, ERROR] }
        checks: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
    QaStatus:
      type: string
      enum: [NOT_RUN, PASS, WARNING, ERROR]
    QaRun:
      type: object
      required: [id, status, results, createdAt]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/QaStatus" }
        results: { type: array, items: { $ref: "#/components/schemas/QaResult" } }
        createdAt: { type: string, format: date-time }
    QaResult:
      type: object
      required: [category, label, status, detail]
      properties:
        category: { type: string }
        label: { type: string }
        status: { type: string, enum: [PASS, WARNING, ERROR] }
        detail: { type: string }
    PstWorkspace:
      type: object
      required: [project, steps]
      properties:
        project: { $ref: "#/components/schemas/PstProject" }
        steps: { type: array, items: { $ref: "#/components/schemas/WorkflowStep" } }
    FactoryEvent:
      type: object
      required: [id, type, message, createdAt]
      properties:
        id: { type: string }
        type: { type: string }
        message: { type: string }
        projectId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    DashboardSummary:
      type: object
      required: [totalProjects, activeProjects, publishedProjects, assets, reuseRate, qaPassRate]
      properties:
        totalProjects: { type: number }
        activeProjects: { type: number }
        publishedProjects: { type: number }
        assets: { type: number }
        reuseRate: { type: number }
        qaPassRate: { type: number }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

