openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PST Factory product manufacturing platform API
servers:
  - url: /api
    description: Base API path
security:
  - clerkSession: []
tags:
  - name: health
    description: Health operations
  - name: dashboard
  - name: projects
  - name: libraries
  - name: manufacturing
paths:
  /healthz:
    get:
      operationId: healthCheck
      security: []
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /pst/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get factory dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /pst/dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent factory activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FactoryEvent"
  /pst/projects:
    get:
      operationId: listPstProjects
      tags: [projects]
      summary: List PST projects
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProjectStatus"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: PST project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PstProject"
    post:
      operationId: createPstProject
      tags: [projects]
      summary: Create a PST project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PstProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProject"
  /pst/projects/{projectId}:
    get:
      operationId: getPstProject
      tags: [projects]
      summary: Get a PST project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: PST project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProject"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePstProject
      tags: [projects]
      summary: Update a PST project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PstProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProject"
  /pst/projects/{projectId}/duplicate:
    post:
      operationId: duplicatePstProject
      tags: [projects]
      summary: Duplicate a PST project for reuse
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "201":
          description: Duplicated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProject"
  /pst/projects/{projectId}/archive:
    post:
      operationId: archivePstProject
      tags: [projects]
      summary: Archive a PST project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Archived project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProject"
  /pst/projects/{projectId}/architect:
    post:
      operationId: runPstArchitect
      tags: [manufacturing]
      summary: Generate a proposed PST blueprint
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchitectInput"
      responses:
        "200":
          description: Architect proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstBlueprint"
  /pst/projects/{projectId}/blueprint:
    get:
      operationId: getPstBlueprint
      tags: [manufacturing]
      summary: Get the current PST blueprint
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: PST blueprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstBlueprint"
    patch:
      operationId: updatePstBlueprint
      tags: [manufacturing]
      summary: Edit the PST blueprint
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueprintUpdate"
      responses:
        "200":
          description: Updated PST blueprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstBlueprint"
  /pst/assets:
    get:
      operationId: listPstAssets
      tags: [libraries]
      summary: List reusable PST assets
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/AssetType"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PstAsset"
  /pst/patterns:
    get:
      operationId: listPstPatterns
      tags: [libraries]
      summary: List reusable problem-solving patterns
      responses:
        "200":
          description: Pattern list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PstPattern"
  /pst/recipes:
    get:
      operationId: listPstRecipes
      tags: [libraries]
      summary: List reusable PST recipes
      responses:
        "200":
          description: Recipe list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PstRecipe"
  /pst/projects/{projectId}/builder:
    post:
      operationId: buildPstProject
      tags: [manufacturing]
      summary: Assemble a PST from its blueprint
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildInput"
      responses:
        "200":
          description: Build result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildResult"
  /pst/projects/{projectId}/simulate:
    post:
      operationId: simulatePstProject
      tags: [manufacturing]
      summary: Run a PST simulation
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationInput"
      responses:
        "200":
          description: Simulation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationReport"
  /pst/projects/{projectId}/qa:
    post:
      operationId: runPstQa
      tags: [manufacturing]
      summary: Run PST quality assurance
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: QA run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QaRun"
  /pst/projects/{projectId}/approve:
    post:
      operationId: approvePstProject
      tags: [manufacturing]
      summary: Approve a PST for publishing
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Approved project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProject"
  /pst/projects/{projectId}/publish:
    post:
      operationId: publishPstProject
      tags: [manufacturing]
      summary: Publish an approved PST
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Published project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProject"
        "409":
          description: Publish conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pst/projects/{projectId}/workspace:
    get:
      operationId: getPstWorkspace
      tags: [projects]
      summary: Get the customer-facing PST workspace
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Published workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstWorkspace"
  /pst/projects/{projectId}/releases:
    get:
      operationId: getPstReleases
      tags: [projects]
      summary: List immutable PST releases
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Release history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PstRelease"
  /pst/projects/{projectId}/releases/{releaseId}/restore:
    post:
      operationId: restorePstRelease
      tags: [projects]
      summary: Restore a release into the editable draft
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: releaseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restored project draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProject"
  /pst/projects/{projectId}/members:
    get:
      operationId: listPstProjectMembers
      tags: [projects]
      summary: List project access members
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PstProjectMember"
    post:
      operationId: upsertPstProjectMember
      tags: [projects]
      summary: Add or update a project member role
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PstProjectMemberInput"
      responses:
        "200":
          description: Updated project member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProjectMember"
        "201":
          description: Added project member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstProjectMember"
        "400":
          description: Invalid member user ID or role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only project owners and admins can manage members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The project owner or an existing membership conflicts with this change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pst/projects/{projectId}/members/{userId}:
    delete:
      operationId: removePstProjectMember
      tags: [projects]
      summary: Remove a project member
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: userId
          in: path
          required: true
          description: User whose project membership should be revoked
          schema:
            type: string
      responses:
        "204":
          description: Project member removed
        "403":
          description: Only project owners and admins can remove members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The project owner cannot be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pst/public/workspaces/{slug}:
    get:
      operationId: getPublicPstWorkspace
      security: []
      tags: [projects]
      summary: Get a published customer workspace without factory authentication
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published customer workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PstPublicWorkspace"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProjectStatus:
      type: string
      enum: [DRAFT, ARCHITECTED, BLUEPRINT_READY, BUILDING, PREVIEW, QA, APPROVED, PUBLISHED, ARCHIVED]
    PstProject:
      type: object
      required: [id, name, slug, description, status, version, domain, family, series, problemStatement, targetUser, desiredOutcome, productDna, blueprint, components, selectedPatterns, selectedRecipes, qaStatus, publicationStatus, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        version: { type: string }
        domain: { type: string }
        family: { type: string }
        series: { type: string }
        problemStatement: { type: string }
        targetUser: { type: string }
        desiredOutcome: { type: string }
        productDna: { $ref: "#/components/schemas/ProductDna" }
        blueprint: { $ref: "#/components/schemas/PstBlueprint" }
        components:
          type: array
          items: { $ref: "#/components/schemas/ComponentSelection" }
        selectedPatterns:
          type: array
          description: Pattern library records resolved through project reference relations.
          items: { $ref: "#/components/schemas/PstPattern" }
        selectedRecipes:
          type: array
          description: Recipe library records resolved through project reference relations.
          items: { $ref: "#/components/schemas/PstRecipe" }
        qaStatus: { $ref: "#/components/schemas/QaStatus" }
        publicationStatus: { type: string, enum: [UNPUBLISHED, PUBLISHED, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PstProjectMember:
      type: object
      required: [id, projectId, userId, role, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        userId: { type: string }
        role: { type: string, enum: [admin, editor, viewer] }
        createdAt: { type: string, format: date-time }
        isOwner:
          type: boolean
          description: Whether this member is the project owner. Present on member list responses.
    PstProjectMemberInput:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string, minLength: 1 }
        role: { type: string, enum: [admin, editor, viewer] }
    PstRelease:
      type: object
      required: [id, projectId, version, snapshot, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        version: { type: string }
        snapshot: { $ref: "#/components/schemas/PstReleaseSnapshot" }
        createdAt: { type: string, format: date-time }
    PstReleaseSnapshot:
      type: object
      required: [project, blueprint, workflow, components]
      properties:
        sourceSchemaVersion: { type: string, enum: [pst-release-snapshot.v1] }
        snapshotHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        snapshotHashAlgorithm: { type: string, enum: [sha256-canonical-json.v1] }
        project: { $ref: "#/components/schemas/PstReleaseProject" }
        blueprint: { $ref: "#/components/schemas/PstReleaseBlueprint" }
        workflow:
          type: array
          items: { $ref: "#/components/schemas/WorkflowStep" }
        pattern: { $ref: "#/components/schemas/PstReleasePattern" }
        recipe: { $ref: "#/components/schemas/PstReleaseRecipe" }
        components:
          type: array
          items: { $ref: "#/components/schemas/PstReleaseComponent" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/PstReleaseRule" }
        providers:
          type: array
          items: { $ref: "#/components/schemas/PstReleaseProvider" }
    PstReleasePattern:
      type: object
      required: [id, name, steps]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        steps: { type: array, items: { type: string } }
    PstReleaseRecipe:
      type: object
      required: [id, name, components]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        components: { type: array, items: { type: string } }
    PstReleaseRule:
      type: object
      required: [id, version, name, kind, when, then]
      properties:
        id: { type: string }
        version: { type: string }
        name: { type: string }
        kind: { type: string }
        when: { type: object, additionalProperties: true }
        then:
          type: array
          items: { type: object, additionalProperties: true }
    PstReleaseProvider:
      type: object
      required: [id, capability, mode]
      properties:
        id: { type: string }
        capability: { type: string }
        mode: { type: string }
        configuration: { type: object, additionalProperties: true }
    PstReleaseProject:
      type: object
      required: [name, description, status, version, domain, family, series, problemStatement, targetUser, desiredOutcome, productDna, qaStatus, publicationStatus]
      properties:
        name: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        version: { type: string }
        domain: { type: string }
        family: { type: string }
        series: { type: string }
        problemStatement: { type: string }
        targetUser: { type: string }
        desiredOutcome: { type: string }
        productDna: { $ref: "#/components/schemas/ProductDna" }
        qaStatus: { $ref: "#/components/schemas/QaStatus" }
        publicationStatus: { type: string, enum: [UNPUBLISHED, PUBLISHED, ARCHIVED] }
    PstReleaseBlueprint:
      type: object
      required: [id, projectId, problem, targetUser, desiredOutcome, problemType, journey, knowledgeRequirements, componentRequirements, aiRequirements, expectedOutput, actionPlan, nextStep, version, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        problem: { type: string }
        targetUser: { type: string }
        desiredOutcome: { type: string }
        problemType: { type: string }
        journey: { type: array, items: { type: string } }
        knowledgeRequirements: { type: array, items: { type: string } }
        componentRequirements: { type: array, items: { type: string } }
        aiRequirements: { type: array, items: { type: string } }
        expectedOutput: { type: array, items: { type: string } }
        actionPlan: { type: array, items: { type: string } }
        nextStep: { type: string }
        version: { type: string }
        updatedAt: { type: string, format: date-time }
    PstReleaseComponent:
      type: object
      required: [assetId, name, type, source, status, required]
      properties:
        id: { type: string }
        assetId: { type: string }
        name: { type: string }
        type: { type: string }
        source: { type: string }
        version: { type: string }
        status: { type: string }
        required: { type: boolean }
        configuration: { type: object, additionalProperties: true }
    PstProjectInput:
      type: object
      required: [name, problemStatement, targetUser, desiredOutcome]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        domain: { type: string }
        family: { type: string }
        series: { type: string }
        problemStatement: { type: string, minLength: 1 }
        targetUser: { type: string, minLength: 1 }
        desiredOutcome: { type: string, minLength: 1 }
    PstProjectUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        domain: { type: string }
        family: { type: string }
        series: { type: string }
        problemStatement: { type: string }
        targetUser: { type: string }
        desiredOutcome: { type: string }
    ProductDna:
      type: object
      required: [problem, user, journey, components, intelligence, outcome]
      properties:
        problem: { type: string }
        user: { type: string }
        journey: { type: array, items: { type: string } }
        components: { type: array, items: { type: string } }
        intelligence: { type: string }
        outcome: { type: string }
    PstBlueprint:
      type: object
      required: [id, projectId, problem, targetUser, desiredOutcome, problemType, journey, knowledgeRequirements, componentRequirements, aiRequirements, workflow, expectedOutput, actionPlan, nextStep, version, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        problem: { type: string }
        targetUser: { type: string }
        desiredOutcome: { type: string }
        problemType: { type: string }
        journey: { type: array, items: { type: string } }
        knowledgeRequirements: { type: array, items: { type: string } }
        componentRequirements: { type: array, items: { type: string } }
        aiRequirements: { type: array, items: { type: string } }
        workflow: { type: array, items: { $ref: "#/components/schemas/WorkflowStep" } }
        expectedOutput: { type: array, items: { type: string } }
        actionPlan: { type: array, items: { type: string } }
        nextStep: { type: string }
        version: { type: string }
        updatedAt: { type: string, format: date-time }
    BlueprintUpdate:
      type: object
      properties:
        problem: { type: string }
        targetUser: { type: string }
        desiredOutcome: { type: string }
        problemType: { type: string }
        journey: { type: array, items: { type: string } }
        knowledgeRequirements: { type: array, items: { type: string } }
        componentRequirements: { type: array, items: { type: string } }
        aiRequirements: { type: array, items: { type: string } }
        expectedOutput: { type: array, items: { type: string } }
        actionPlan: { type: array, items: { type: string } }
        nextStep: { type: string }
    ArchitectInput:
      type: object
      properties:
        additionalContext: { type: string }
        patternId: { type: string, nullable: true }
        recipeId: { type: string, nullable: true }
    WorkflowStep:
      type: object
      required: [id, type, title, description, inputs, outputs, dependencies, nextStep]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        description: { type: string }
        inputs: { type: array, items: { type: string } }
        outputs: { type: array, items: { type: string } }
        dependencies: { type: array, items: { type: string } }
        nextStep: { type: string }
        configuration: { type: object, additionalProperties: true }
    AssetType:
      type: string
      enum: [KNOWLEDGE, TOOL, MINI_APP, AI, WORKFLOW]
    PstAsset:
      type: object
      required: [id, name, type, description, version, status, tags, domain, compatibility, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        type: { $ref: "#/components/schemas/AssetType" }
        description: { type: string }
        version: { type: string }
        status: { type: string, enum: [ACTIVE, DRAFT, ARCHIVED] }
        tags: { type: array, items: { type: string } }
        domain: { type: string }
        compatibility: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PstPattern:
      type: object
      required: [id, name, version, description, steps, usageCount, projectIds, projects]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        steps: { type: array, items: { type: string } }
        usageCount: { type: number }
        projectIds: { type: array, items: { type: string } }
        projects:
          type: array
          items: { $ref: "#/components/schemas/ReferenceProject" }
    PstRecipe:
      type: object
      required: [id, name, version, description, components, usageCount, projectIds, projects]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        components: { type: array, items: { type: string } }
        usageCount: { type: number }
        projectIds: { type: array, items: { type: string } }
        projects:
          type: array
          items: { $ref: "#/components/schemas/ReferenceProject" }
    ReferenceProject:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    ComponentSelection:
      type: object
      required: [id, name, type, source, status]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        source: { type: string }
        status: { type: string, enum: [READY, MISSING, WARNING] }
    BuildInput:
      type: object
      properties:
        assetIds: { type: array, items: { type: string } }
        patternId: { type: string, nullable: true }
        recipeId: { type: string, nullable: true }
    BuildResult:
      type: object
      required: [status, ready, missing, warnings, errors, components]
      properties:
        status: { type: string, enum: [READY, BLOCKED] }
        ready: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        errors: { type: array, items: { type: string } }
        components: { type: array, items: { $ref: "#/components/schemas/ComponentSelection" } }
    SimulationInput:
      type: object
      properties:
        mode: { type: string, enum: [MANUAL, SYNTHETIC] }
    SimulationReport:
      type: object
      required: [id, status, checks, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [PASS, WARNING, ERROR] }
        checks: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
    QaStatus:
      type: string
      enum: [NOT_RUN, PASS, WARNING, ERROR]
    QaRun:
      type: object
      required: [id, status, results, createdAt]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/QaStatus" }
        results: { type: array, items: { $ref: "#/components/schemas/QaResult" } }
        createdAt: { type: string, format: date-time }
    QaResult:
      type: object
      required: [category, label, status, detail]
      properties:
        category: { type: string }
        label: { type: string }
        status: { type: string, enum: [PASS, WARNING, ERROR] }
        detail: { type: string }
    PstWorkspace:
      type: object
      required: [project, steps]
      properties:
        project: { $ref: "#/components/schemas/PstProject" }
        steps: { type: array, items: { $ref: "#/components/schemas/WorkflowStep" } }
    PstPublicWorkspace:
      type: object
      required: [project, steps, definition]
      properties:
        project: { $ref: "#/components/schemas/PstPublicProject" }
        steps: { type: array, items: { $ref: "#/components/schemas/PublicWorkflowStep" } }
        definition: { $ref: "#/components/schemas/ExecutablePstDefinition" }
    ExecutablePstDefinition:
      type: object
      description: Validated, data-only ExecutablePstDefinitionV1 emitted from the immutable release.
      additionalProperties: true
    PstPublicProject:
      type: object
      required: [id, name, slug, description, status, version, domain, family, series, problemStatement, targetUser, desiredOutcome, productDna, blueprint]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        version: { type: string }
        domain: { type: string }
        family: { type: string }
        series: { type: string }
        problemStatement: { type: string }
        targetUser: { type: string }
        desiredOutcome: { type: string }
        productDna: { $ref: "#/components/schemas/PublicProductDna" }
        blueprint: { $ref: "#/components/schemas/PublicPstBlueprint" }
    PublicProductDna:
      type: object
      required: [problem, user, journey, outcome]
      properties:
        problem: { type: string }
        user: { type: string }
        journey: { type: array, items: { type: string } }
        outcome: { type: string }
    PublicPstBlueprint:
      type: object
      required: [id, projectId, problem, targetUser, desiredOutcome, problemType, journey, workflow, expectedOutput, actionPlan, nextStep, version, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        problem: { type: string }
        targetUser: { type: string }
        desiredOutcome: { type: string }
        problemType: { type: string }
        journey: { type: array, items: { type: string } }
        workflow: { type: array, items: { $ref: "#/components/schemas/PublicWorkflowStep" } }
        expectedOutput: { type: array, items: { type: string } }
        actionPlan: { type: array, items: { type: string } }
        nextStep: { type: string }
        version: { type: string }
        updatedAt: { type: string, format: date-time }
    PublicWorkflowStep:
      type: object
      required: [id, type, title, description, inputs, outputs, dependencies, nextStep]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        description: { type: string }
        inputs: { type: array, items: { type: string } }
        outputs: { type: array, items: { type: string } }
        dependencies: { type: array, items: { type: string } }
        nextStep: { type: string }
    FactoryEvent:
      type: object
      required: [id, type, message, createdAt]
      properties:
        id: { type: string }
        type: { type: string }
        message: { type: string }
        projectId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    DashboardSummary:
      type: object
      required: [totalProjects, activeProjects, publishedProjects, assets, reuseRate, qaPassRate]
      properties:
        totalProjects: { type: number }
        activeProjects: { type: number }
        publishedProjects: { type: number }
        assets: { type: number }
        reuseRate: { type: number }
        qaPassRate: { type: number }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        retryable: { type: boolean }

